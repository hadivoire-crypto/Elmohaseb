async function run(p){const{error}=await p;if(error){alert(error.message);return false}
 try{await load()}catch(e){alert(e.message);return false}R();return true}
function renderLogin(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $('app').innerHTML=`<main style="padding-top:70px"><h1 style="text-align:center;font-size:28px">${t('app')}</h1><div class="card"><input id="em" type="email" autocomplete="username" placeholder="${L2('البريد الإلكتروني','Email')}"><input id="pw" type="password" autocomplete="current-password" placeholder="${L2('كلمة المرور','Password')}"><button class="btn" style="width:100%;margin-top:6px" onclick="login()">${L2('دخول','Sign in')}</button><div class="mu" id="lerr"></div></div><div style="text-align:center"><button class="lang" onclick="lang=lang==='ar'?'en':'ar';ls('mz_lang',lang);renderLogin()">${lang==='ar'?'EN':'عربي'}</button></div></main>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(error){$('lerr').textContent=error.message;return}enter()}
async function logout(){await sb.auth.signOut();window.AUTHED=false;renderLogin()}
async function enter(){$('app').innerHTML='<p style="padding:40px;text-align:center" class="mu">...</p>';
 try{await load();window.AUTHED=true;R()}catch(e){$('app').innerHTML='';renderLogin();$('lerr').textContent=e.message}}
async function boot(){const{data}=await sb.auth.getSession();if(data.session)enter();else renderLogin()}

 const o={name_ar:ar,name_en:en,sale_price:+$('sp').value||0,min_stock:+$('mn').value||0,track_expiry:$('tr').checked},id=editId;editId=null;
 await run(id?sb.from('products').update(o).eq('id',id):sb.from('products').insert(o))}

async function savePurchase(){const L=readLines().filter(l=>l.pid&&+l.qty>0);if(!L.length)return;
 const a={p_supplier:$('sup').value,p_date:$('dt').value||today(),p_source:'manual',p_lines:L.map(l=>({product_id:l.pid,qty:+l.qty,unit_cost:+l.cost||0,expiry:l.exp||null}))};
 draft=[{}];await run(sb.rpc('record_purchase',a))}
async function saveSale(){const L=readLines().filter(l=>l.pid&&+l.qty>0);if(!L.length)return;
 const need={};L.forEach(l=>need[l.pid]=(need[l.pid]||0)+(+l.qty));
 for(const pid in need){if(avail(pid)<need[pid]){alert(t('nostk'));return}}
 const a={p_customer:$('cu').value,p_date:$('dt').value||today(),p_discount:+$('ds').value||0,p_lines:L.map(l=>({product_id:l.pid,qty:+l.qty,price:(l.cost!==''&&l.cost!=null)?+l.cost:null}))};
 draft=[{}];await run(sb.rpc('record_sale',a))}
async function impCommit(){const m=impCalc();if(!imp.lines.length)return;if(m.dup&&!confirm(t('dup')))return;
 const lines=[];imp.lines.forEach((l,i)=>{const c=m.L[i],n=String(l.n||'').trim(),q=(+l.q||0)*(+l.p||1);if(!n||q<=0)return;
  lines.push({product_id:c.pid||null,name_en:c.pid?null:n,qty:q,unit_cost:c.uc,sale_price:c.sp,expiry:l.e||null})});
 if(!lines.length)return;
 const ok=await run(sb.rpc('record_purchase',{p_supplier:imp.sup,p_date:imp.date,p_lines:lines,p_source:'import'}));
 if(ok){imp=impEmpty();ls('mz_imp',imp);tab='buys';R()}}
